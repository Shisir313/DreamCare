# Ruff configuration for DermaCare Backend
line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line length handled by formatter
    "DJ001", # null=True on text fields when necessary
]

[lint.isort]
known-first-party = ["config", "core", "accounts"]
combine-as-imports = true

[lint.per-file-ignores]
"**/tests/**" = ["D", "S101"]
"config/settings/**" = ["F403", "F405"]
