          - $ref: '#/components/schemas/TypeEnum'
          default: video
        symptoms:
          type: string
          default: ''
      required:
      - slot_id
    CalculateHydrationRequestRequest:
      type: object
      properties:
        weight_kg:
          type: number
          format: double
          maximum: 300
          minimum: 20
