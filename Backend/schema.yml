        * `basic` - Basic Plan
        * `premium` - Premium Plan
        * `pay_per_consultation` - Pay-per-Consultation
    ConsentPolicy:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        policy_type:
          allOf:
          - $ref: '#/components/schemas/PolicyTypeEnum'
          description: |-
            Type of policy (e.g. privacy, health data, terms)

            * `terms_of_service` - Terms of Service
            * `privacy_policy` - Privacy Policy
            * `health_data_consent` - Health Data Consent
            * `telemedicine_consent` - Telemedicine Consent
        version:
          type: string
          description: Policy version identifier (e.g. 1.0, 1.1)
