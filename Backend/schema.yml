    WeeklyCheckIn:
      type: object
      description: Weekly skin progress photo check-in representation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        weekNumber:
          type: integer
        status:
          type: string
        frontPhotoUrl:
          type: string
          nullable: true
          readOnly: true
        leftPhotoUrl:
          type: string
          nullable: true
          readOnly: true
        rightPhotoUrl:
          type: string
          nullable: true
          readOnly: true
        patientNote:
          type: string
        dermatologistFeedback:
          type: string
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        submittedAt:
          type: string
          format: date-time
      required:
      - dermatologistFeedback
      - frontPhotoUrl
      - id
      - leftPhotoUrl
      - patientNote
      - reviewedAt
      - rightPhotoUrl
      - status
      - submittedAt
      - weekNumber
    WeeklyCheckInStatusOverview:
      type: object
      properties:
        weekNumber:
          type: integer
        isUnlocked:
          type: boolean
        unlockDate:
          type: string
          format: date
        isSubmitted:
          type: boolean
        checkIn:
          allOf:
          - $ref: '#/components/schemas/WeeklyCheckIn'
          nullable: true
      required:
      - checkIn
      - isSubmitted
      - isUnlocked
      - unlockDate
      - weekNumber
    WeeklyCheckInSubmissionRequest:
      type: object
      properties:
        week_number:
          type: integer
          maximum: 4
          minimum: 1
        front_photo_id:
          type: string
          format: uuid
          nullable: true
        left_photo_id:
          type: string
          format: uuid
          nullable: true
        right_photo_id:
          type: string
          format: uuid
          nullable: true
        patient_note:
          type: string
          default: ''
      required:
      - week_number
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
