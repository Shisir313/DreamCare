components:
  schemas:
    AcceptConsentRequestRequest:
      type: object
      properties:
        consents:
          type: array
          items:
            $ref: '#/components/schemas/PolicyAcceptItemRequest'
      required:
      - consents
    AccountHardDeleteInlineResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
    ActivityLevelEnum:
      enum:
      - sedentary
      - light
      - moderate
      - active
      type: string
      description: |-
        * `sedentary` - Sedentary
        * `light` - Light (1-2 days/week)
        * `moderate` - Moderate (3-4 days/week)
        * `active` - Active (5+ days/week)
    AmendPrescriptionRequestRequest:
      type: object
      properties:
        diagnosis:
          type: string
          minLength: 1
          maxLength: 255
        medications:
          type: array
          items:
            $ref: '#/components/schemas/MedicationRequest'
        instructions:
          type: string
        notes:
          type: string
        follow_up_date:
          type: string
          format: date
          nullable: true
        lab_tests:
          type: array
          items:
            type: string
            minLength: 1
        publish_now:
          type: boolean
          default: true
    AngleEnum:
      enum:
      - front
      - left
      - right
      type: string
      description: |-
        * `front` - Front Facing
        * `left` - Left Profile (45°/90°)
        * `right` - Right Profile (45°/90°)
    Appointment:
      type: object
      description: Appointment model matching Flutter Appointment representation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        doctorId:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        dateTime:
          type: string
          format: date-time
          readOnly: true
        type:
          type: string
        status:
          type: string
        fee:
          type: integer
          readOnly: true
        feePaisa:
          type: integer
          readOnly: true
        doctor:
          allOf:
          - $ref: '#/components/schemas/Doctor'
          readOnly: true
        symptoms:
          type: string
        notes:
          type: string
        roomChannel:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - dateTime
      - doctor
      - doctorId
      - fee
      - feePaisa
      - id
      - notes
      - roomChannel
      - status
      - symptoms
      - type
      - userId
    AuthSuccessResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      required:
      - access
      - refresh
      - user
    BookAppointmentRequestRequest:
      type: object
      properties:
        slot_id:
          type: string
          format: uuid
