openapi: 3.0.3
info:
  title: DermaCare Nepal API
  version: 1.0.0
  description: Backend REST API contract for DermaCare - Personalized skincare and
    dermatology consultation platform for Nepal.
paths:
  /api/v1/auth/email/verify/confirm/:
    post:
      operationId: auth_email_verify_confirm_create
      description: Verifies user's email address using token.
      summary: Confirm Email Verification
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifyConfirmResponse'
          description: ''
  /api/v1/auth/email/verify/request/:
    post:
      operationId: auth_email_verify_request_create
      description: Generates an email verification token for the current user.
      summary: Request Email Verification
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifyRequestResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates with email or Nepal phone number + password. Returns
        JWT pair and user profile.
      summary: Login with Phone or Email
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token.
      summary: Logout
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns full profile of currently authenticated user.
      summary: Get Current User Profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: 'Update profile attributes: name, phone, or date of birth.'
      summary: Update Current User Profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    delete:
      operationId: auth_me_destroy
      description: Permanently erases user database records and all facial photographs
        from storage.
      summary: Permanently Delete Account & Photos
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHardDeleteInlineResponse'
          description: ''
  /api/v1/auth/me/export/:
    get:
      operationId: auth_me_export_retrieve
      description: Returns full machine-readable JSON archive of user account, clinical
        assessments, consents, and photos.
      summary: Export User Data Archive
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataExportResponse'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Changes user password upon confirming current password.
      summary: Change Password
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Resets user password with valid 6-digit code or reset token.
      summary: Confirm Password Reset
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
  /api/v1/auth/password/reset/request/:
    post:
      operationId: auth_password_reset_request_create
      description: Sends a 6-digit reset code or token to user email or phone.
      summary: Request Password Reset
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates a new patient user account. Dermatologists and admins are
        provisioned by admin.
      summary: Register New Patient
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: Takes email and password credentials and returns an access token
        (15m) and refresh token (7d).
      summary: Obtain JWT Token Pair
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Takes a valid refresh token and returns a new access token while
        rotating and blacklisting the previous refresh token.
      summary: Refresh JWT Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenRefresh'
          description: ''
  /api/v1/check-ins/:
    get:
      operationId: check_ins_list
      description: Returns list of prescriptions for current patient or authoring
        doctor.
      summary: List Prescriptions
      tags:
      - Prescriptions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prescription'
          description: ''
    post:
      operationId: check_ins_create
      description: Authored exclusively by verified dermatologists.
      summary: Create Prescription
      tags:
      - Prescriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrescriptionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePrescriptionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePrescriptionRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
          description: ''
  /api/v1/check-ins/{prescription_id}/:
    get:
      operationId: check_ins_retrieve
      description: Retrieves prescription details. Logs read audit record when accessed
        by patient.
      summary: Get Prescription Details
      parameters:
      - in: path
        name: prescription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Prescriptions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
          description: ''
  /api/v1/check-ins/{prescription_id}/amend/:
    post:
      operationId: check_ins_amend_create
      description: Creates version v+1 amendment while retaining the published historical
        record.
      summary: Amend Prescription
      parameters:
      - in: path
        name: prescription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Prescriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendPrescriptionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AmendPrescriptionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AmendPrescriptionRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
          description: ''
  /api/v1/check-ins/{prescription_id}/publish/:
    post:
      operationId: check_ins_publish_create
      description: Locks clinical contents permanently as an immutable record.
      summary: Publish Prescription
      parameters:
      - in: path
        name: prescription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Prescriptions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
          description: ''
  /api/v1/check-ins/check-ins/{checkin_id}/review/:
    post:
      operationId: check_ins_check_ins_review_create
      description: Dermatologist reviews photos and submits clinical guidance.
      summary: Review Weekly Check-in
      parameters:
      - in: path
        name: checkin_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Check-ins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCheckInRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewCheckInRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewCheckInRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyCheckIn'
          description: ''
  /api/v1/check-ins/check-ins/history/:
    get:
      operationId: check_ins_check_ins_history_list
      description: View past check-ins and clinical feedbacks. Unlocked permanently
        even after plan expiry.
      summary: Check-in History
      tags:
      - Check-ins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyCheckIn'
          description: ''
  /api/v1/check-ins/check-ins/status/:
    get:
      operationId: check_ins_check_ins_status_list
      description: Returns 4-week unlock schedule, unlock dates in Asia/Kathmandu,
        and submission status.
      summary: Weekly Check-in Status
      tags:
      - Check-ins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyCheckInStatusOverview'
          description: ''
  /api/v1/check-ins/check-ins/submit/:
    post:
      operationId: check_ins_check_ins_submit_create
      description: Uploads front, left, and right photos + optional note. Consumes
        check-in entitlement.
      summary: Submit Weekly Check-in
      tags:
      - Check-ins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyCheckInSubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WeeklyCheckInSubmissionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WeeklyCheckInSubmissionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyCheckIn'
          description: ''
  /api/v1/consent/accept/:
    post:
      operationId: consent_accept_create
      description: Records acceptance of specific policy types and versions. Stores
        cryptographic hash of IP and UA.
      summary: Accept Policies
      tags:
      - Consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptConsentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptConsentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptConsentRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'
          description: ''
  /api/v1/consent/policies/:
    get:
      operationId: consent_policies_list
      description: Returns list of all active policies, their versions, legal summaries,
        and user acceptance status.
      summary: List Active Consent Policies
      tags:
      - Consent
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentPolicy'
          description: ''
  /api/v1/consent/status/:
    get:
      operationId: consent_status_retrieve
      description: Returns whether the user has satisfied all mandatory active policy
        requirements.
      summary: Check User Consent Status
      tags:
      - Consent
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'
          description: ''
  /api/v1/consultations/appointments/:
    get:
      operationId: consultations_appointments_list
      description: Returns list of consultation appointments for the current user.
      summary: List Appointments
      tags:
      - Consultations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/consultations/appointments/{appointment_id}/:
    get:
      operationId: consultations_appointments_retrieve
      description: Returns appointment metadata, status, symptoms, and doctor info.
      summary: Get Appointment Details
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/consultations/appointments/{appointment_id}/cancel/:
    post:
      operationId: consultations_appointments_cancel_create
      description: Cancels appointment, releases availability slot, and restores entitlement
        if > 2h before start.
      summary: Cancel Appointment
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/consultations/appointments/{appointment_id}/reschedule/:
    post:
      operationId: consultations_appointments_reschedule_create
      description: Atomically swaps to a new slot with the same doctor.
      summary: Reschedule Appointment
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleAppointmentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RescheduleAppointmentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RescheduleAppointmentRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/consultations/appointments/{appointment_id}/video-token/:
    post:
      operationId: consultations_appointments_video_token_create
      description: Issues temporary RTC token. Enforces join window (15 minutes prior
        to appointment start time).
      summary: Generate Agora Video Room Token
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTokenResponse'
          description: ''
  /api/v1/consultations/book/:
    post:
      operationId: consultations_book_create
      description: Atomically locks slot and decrements consultation entitlement from
        active membership.
      summary: Book Appointment
      tags:
      - Consultations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/consultations/doctors/:
    get:
      operationId: consultations_doctors_list
      description: Returns list of administrative-verified dermatologists. Supports
        specialty and search query filters.
      summary: List Verified Doctors
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Search by name, qualifications, or hospital
      - in: query
        name: specialty
        schema:
          type: string
        description: Filter by specialty (e.g. dermatologist, cosmetologist)
      tags:
      - Consultations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'
          description: ''
  /api/v1/consultations/doctors/{doctor_id}/:
    get:
      operationId: consultations_doctors_retrieve
      description: Returns full profile of a verified doctor including fees, languages,
        and qualifications.
      summary: Get Doctor Profile Details
      parameters:
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
          description: ''
  /api/v1/consultations/doctors/{doctor_id}/slots/:
    get:
      operationId: consultations_doctors_slots_list
      description: Returns available unbooked slots for a doctor on a date in Asia/Kathmandu.
      summary: List Doctor Available Slots
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Date in YYYY-MM-DD format (Asia/Kathmandu)
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'
          description: ''
  /api/v1/consultations/slots/create/:
    post:
      operationId: consultations_slots_create_create
      description: Doctor creates a consultation availability slot.
      summary: Create Availability Slot
      tags:
      - Consultations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSlotRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSlotRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSlotRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlot'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Returns system operational status, UTC & Asia/Kathmandu timestamps,
        and database health.
      summary: System Health Check
      tags:
      - System
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
