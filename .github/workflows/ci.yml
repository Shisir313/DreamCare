name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/ci.yml'

jobs:
  lint-test-and-schema:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_dermacare
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django factory-boy ruff psycopg[binary]

      - name: Run Ruff Lint and Format Check
        working-directory: ./Backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Suite
        working-directory: ./Backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: ci-test-secret-key-derma-care-2026
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_dermacare
          TIME_ZONE: Asia/Kathmandu
        run: |
          python -m pytest

      - name: Validate OpenAPI Schema Up-to-Date
        working-directory: ./Backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: ci-test-secret-key-derma-care-2026
        run: |
          python manage.py spectacular --file schema_generated.yml
          diff -u schema.yml schema_generated.yml || (echo "schema.yml is out of date! Please run: python manage.py spectacular --file schema.yml" && exit 1)
